<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes</title>

  <!-- Connects the page to the project styling and JavaScript -->
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture your ideas before they disappear.</p>
  </header>

  <main>
    <!-- Section for creating new notes -->
    <section aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a Note</h2>

      <form id="note-form">
        <label for="note-input">Note</label>
        <input
          type="text"
          id="note-input"
          placeholder="Write your note..."
        />

        <label for="note-category">Category</label>
        <select id="note-category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>

        <button type="submit">Add Note</button>
      </form>

      <!-- JavaScript displays validation errors here -->
      <p id="error-message"></p>
    </section>

    <!-- Section for searching and displaying notes -->
    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">My Notes</h2>

      <label for="search-input">Search notes</label>
      <input
        type="search"
        id="search-input"
        placeholder="Search notes..."
      />

      <!-- JavaScript uses this button to remove every note after confirmation -->
      <button type="button" id="clear-all-btn">Clear All</button>

      <p id="note-count">You have no notes.</p>

      <!-- JavaScript creates note cards inside this list -->
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes &copy; 2026-M.A.N</p>
  </footer>
</body>
</html>
